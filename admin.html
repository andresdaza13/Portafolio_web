<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Andrés Daza</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>
<div data-include="partials/nav.html"></div>
 
<section id="login-section">
  <h1>Acceso de administrador</h1>
  <form id="login-form" class="form-panel">
    <label for="email">Correo</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button class="btn primary" type="submit">Entrar</button>
    <div class="form-error" id="login-error"></div>
  </form>
</section>
 
<section id="admin-section" class="hidden">
  <div class="admin-topbar">
    <h1 style="margin:0;">Panel de proyectos</h1>
    <button class="btn" id="logout-btn">Cerrar sesión</button>
  </div>
 
  <div id="lista-admin"></div>
 
  <h2 style="margin-top:3rem;">Agregar / editar proyecto</h2>
  <form id="project-form" class="form-panel">
    <input type="hidden" id="editing-id">
    <label for="titulo">Título</label>
    <input id="titulo" required>
    <label for="anio">Año</label>
    <input id="anio">
    <label for="desc">Descripción</label>
    <textarea id="desc"></textarea>
    <label for="stack">Tecnologías</label>
    <input id="stack" placeholder="Python · scikit-learn">
    <label for="link">Enlace (GitHub, demo...)</label>
    <input id="link" type="url">
    <button class="btn primary" type="submit" id="submit-btn">Guardar proyecto</button>
    <div class="form-error" id="project-error"></div>
  </form>
</section>
 
<div data-include="partials/footer.html"></div>
 
<script type="module">
  import { includeHTML } from './js/includes.js';
  import { login, logout, watchAuth } from './js/auth.js';
  import { getProjects, addProject, updateProject, deleteProject } from './js/data.js';
 
  await includeHTML();
 
  const loginSection = document.getElementById('login-section');
  const adminSection = document.getElementById('admin-section');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const listaAdmin = document.getElementById('lista-admin');
  const projectForm = document.getElementById('project-form');
  const editingId = document.getElementById('editing-id');
  const submitBtn = document.getElementById('submit-btn');
 
  // watchAuth se ejecuta cada vez que cambia el estado de sesión
  // (login, logout, o al recargar la página si ya había sesión activa).
  watchAuth((user) => {
    loginSection.classList.toggle('hidden', !!user);
    adminSection.classList.toggle('hidden', !user);
    if (user) cargarProyectos();
  });
 
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    try {
      await login(document.getElementById('email').value, document.getElementById('password').value);
    } catch (err) {
      loginError.textContent = 'Correo o contraseña incorrectos.';
    }
  });
 
  document.getElementById('logout-btn').addEventListener('click', () => logout());
 
  async function cargarProyectos() {
    const proyectos = await getProjects();
    listaAdmin.innerHTML = proyectos.map((p) => `
      <div class="admin-item">
        <strong>${p.titulo}</strong>
        <span style="color:var(--ink-dim); font-size:.9rem;">${p.desc || ''}</span>
        <div class="admin-actions">
          <button data-edit='${JSON.stringify(p).replace(/'/g, "&apos;")}'>Editar</button>
          ${p.id ? `<button class="danger" data-delete="${p.id}">Eliminar</button>` : ''}
        </div>
      </div>
    `).join('');
  }
 
  listaAdmin.addEventListener('click', async (e) => {
    if (e.target.dataset.edit) {
      const p = JSON.parse(e.target.dataset.edit);
      editingId.value = p.id || '';
      document.getElementById('titulo').value = p.titulo || '';
      document.getElementById('anio').value = p.anio || '';
      document.getElementById('desc').value = p.desc || '';
      document.getElementById('stack').value = p.stack || '';
      document.getElementById('link').value = p.link || '';
      submitBtn.textContent = 'Guardar cambios';
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    if (e.target.dataset.delete) {
      if (confirm('¿Eliminar este proyecto?')) {
        await deleteProject(e.target.dataset.delete);
        cargarProyectos();
      }
    }
  });
 
  const projectError = document.getElementById('project-error');
 
  projectForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    projectError.textContent = '';
    const proyecto = {
      titulo: document.getElementById('titulo').value,
      anio: document.getElementById('anio').value,
      desc: document.getElementById('desc').value,
      stack: document.getElementById('stack').value,
      link: document.getElementById('link').value,
    };
    try {
      if (editingId.value) {
        await updateProject(editingId.value, proyecto);
      } else {
        await addProject(proyecto);
      }
      projectForm.reset();
      editingId.value = '';
      submitBtn.textContent = 'Guardar proyecto';
      cargarProyectos();
    } catch (err) {
      // Antes esto fallaba en silencio. Ahora te decimos exactamente
      // qué fue mal (ej. "Missing or insufficient permissions" si
      // faltan las reglas de seguridad de Firestore).
      projectError.textContent = 'No se pudo guardar: ' + err.message;
      console.error(err);
    }
  });
</script>
</body>
</html>
